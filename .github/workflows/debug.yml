name: Debug
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh api repos/$GH_REPO/releases -f tag_name=dbg-d -f target_commitish=0776499a2dfc2b9f25d5dd6d46e6861758848b7d -F prerelease=true || true
          gh api repos/$GH_REPO/releases -f tag_name=dbg-e -f target_commitish=3433186 -F prerelease=true || true
          gh api repos/$GH_REPO --jq .permissions || true
