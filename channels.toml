# Preview build channels. Each channel starts from a base branch and merges the listed branches
# into it, in order. A branch that doesn't merge cleanly is skipped and named in the release notes;
# it never fails the build. Add a branch by adding a [[channels.<name>.merge]] entry.
#
# Keys:
#   title        a short name for the index page and release titles
#   summary      one sentence for the index page
#   base         { repo, branch }: the starting point
#   merge        [{ repo, branch, pr }]: branches merged on top, in order; pr is the pull request
#                number in pr_repo, for the notes (optional)
#   pr_repo      where the pr numbers live (default: tangency-labs/solidcraft)
#   web_note     optional sentence shown next to the browser link

[channels.inventor]
title = "Inventor-familiar options"
summary = "SolidCraft main with the open pull requests for options that make the app feel familiar to Inventor users."
base = { repo = "tangency-labs/solidcraft", branch = "main" }
pr_repo = "tangency-labs/solidcraft"
merge = [
  { repo = "raykholo/solidcraft", branch = "ribbon-tabs-only", pr = 10214 },
  { repo = "raykholo/solidcraft", branch = "sketch-face-owner", pr = 10216 },
  { repo = "raykholo/solidcraft", branch = "sketches-to-parts", pr = 10219 },
  { repo = "raykholo/solidcraft", branch = "web-keep-unsaved", pr = 10221 },
  { repo = "raykholo/solidcraft", branch = "quick-access-bar", pr = 10224 },
]

[channels.plugins]
title = "Plugins"
summary = "The plugins-dutchman branch: SolidCraft with a plugin host."
base = { repo = "raykholo/solidcraft", branch = "plugins-dutchman" }
merge = []
web_note = "The browser version is SolidCraft without plugins: the plugin host runs only in the desktop builds."
